[project]
name = "btr"
version = "0.1.0"
description = "Birth Time Rectification engine implementing Parashara and KP (Krishnamurti Paddhati) methods"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BTR" }]
dependencies = [
    "pyswisseph>=2.10.3.2",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
btr = "btr.cli:main"
btr-web = "btr.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["btr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
